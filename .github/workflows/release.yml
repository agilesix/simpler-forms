name: Release

on:
  push:
    branches: [main]
  # Manual republish of an existing tag. npm binds a trusted publisher to the
  # filename of the workflow that runs `pnpm publish`, so retries live here.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (e.g. v0.1.0)"
        required: true
        type: string

# Each job takes only the scopes it needs, rather than granting them workflow-wide.
permissions: {}

jobs:
  release-please:
    name: Propose or tag a release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Only a push can cut a release; a dispatch publishes the tag it was given.
      - uses: googleapis/release-please-action@v5
        id: release
        if: github.event_name == 'push'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/simpler-forms
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for a short-lived publish credential,
      # so there is no long-lived NPM_TOKEN in this repository.
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || needs.release-please.outputs.tag_name }}
    steps:
      # A dispatch input is arbitrary text; reject anything that is not a release
      # tag before the checkout below runs the code it names.
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::release_tag must look like 'vX.Y.Z'. Got: $RELEASE_TAG"
            exit 1
          fi

      # refs/tags/ pins the checkout to the tag namespace; a same-named branch
      # cannot be substituted.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      # No version pinned: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # `pnpm publish` shells out to the system npm, which must be >= 11.5.1 for
      # OIDC trusted publishing; Node 24 bundles an older npm.
      - run: npm install --global npm@latest

      - run: pnpm install --frozen-lockfile

      # dist/ is not committed, and `main`, `types` and `exports` all resolve into it.
      - run: pnpm build

      # The last gate before an irreversible publish: a version cannot be replaced.
      - run: pnpm checks

      # No NODE_AUTH_TOKEN: the credential comes from the OIDC exchange.
      # --no-git-checks: the checkout is a detached tag, not the main branch.
      - run: pnpm publish --provenance --access public --no-git-checks
