name: Release

on:
  push:
    branches: [main]
  # Manual republish of an existing tag, for when the publish step fails after
  # a tag and GitHub release were successfully created
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (e.g. v0.1.0)"
        required: true
        type: string

# Requires each job to define its own required scopes rather than inheriting
# a default set of workflow-level permissions
permissions: {}

jobs:
  release-please:
    name: Propose or tag a release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Only a push can cut a release; a dispatch publishes the tag it was given.
      - uses: googleapis/release-please-action@v5
        id: release
        if: github.event_name == 'push'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/simpler-forms
    permissions:
      contents: read
      # Creates the OIDC token that npm uses for trusted publishing
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || needs.release-please.outputs.tag_name }}
    steps:
      # Reject invalid release tags before trying to check out the code
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::release_tag must look like 'vX.Y.Z'. Got: $RELEASE_TAG"
            exit 1
          fi

      # refs/tags/ prevents us from accidentally checking out a branch that has
      # the same name as a tag
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # `pnpm publish` requires npm >= 11.5.1 for trusted publishing
      - run: npm install --global npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm checks

      # No NODE_AUTH_TOKEN because the credential comes from the OIDC exchange
      # `--no-git-checks` allows us to publish from a specific release tag
      - run: pnpm publish --provenance --access public --no-git-checks
