name: Release

on:
  push:
    branches: [main]

# Each job takes only the scopes it needs, rather than granting them workflow-wide.
permissions: {}

jobs:
  release-please:
    name: Propose or tag a release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # CI on the release pull request needs approving by hand. A pull request opened
      # by GITHUB_TOKEN has its `pull_request` runs held at `action_required`, which is
      # how the sibling protocol repositories already work. An App token or PAT here
      # would start them automatically, and is worth adding only if main ever requires
      # status checks to merge.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # A tag or release created with GITHUB_TOKEN does not trigger other workflows, so
  # publishing has to be called from this run rather than keyed to `on: release`.
  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/simpler-forms
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for a short-lived publish credential,
      # so there is no long-lived NPM_TOKEN in this repository.
      id-token: write
    steps:
      # The tag, not the branch: main can move between release-please tagging and
      # this job starting, and what gets published must be what was tagged.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # No version pinned here: the action reads `packageManager` from package.json,
      # so pnpm is upgraded in one place for local work and CI alike.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # `pnpm publish` shells out to the system npm, which must be 11.5.1 or newer to
      # perform the OIDC exchange. Node 24 bundles an older npm, which would find no
      # token, fall back to unauthenticated and fail.
      - run: npm install --global npm@latest

      - run: pnpm install --frozen-lockfile

      # dist/ is not committed, and `main`, `types` and `exports` all resolve into it.
      - run: pnpm build

      # The last gate before an irreversible publish: a version cannot be replaced.
      - run: pnpm checks

      # No NODE_AUTH_TOKEN: the credential comes from the OIDC exchange. `--no-git-checks`
      # because the checkout above leaves a detached HEAD, which pnpm otherwise refuses.
      - run: pnpm publish --provenance --access public --no-git-checks
