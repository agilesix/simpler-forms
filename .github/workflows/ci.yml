name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build, check and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      # No version pinned here: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: lib/*.tsp imports dist/src/index.js to resolve its `extern dec`
      # declarations, so the TypeSpec sources do not type-check until the JS exists.
      - run: pnpm build

      - run: pnpm checks
